[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "threathawk-standalone"
version = "1.0.0"
description = "Guided indicator research and bounded website observations"
requires-python = ">=3.10"
authors = [{name = "Neil Machado"}]
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["requests>=2.32,<3", "rich>=13,<15", "beautifulsoup4>=4.12,<5", "dnspython>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
threathawk-new = "hawk.ui:main"

[tool.setuptools.packages.find]
include = ["hawk*"]
